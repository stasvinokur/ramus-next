pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Toolchain auto-detection on macOS only scans /Library/Java/JavaVirtualMachines,
    // so a Homebrew or SDKMAN JDK is invisible to it and the build would fail with
    // "No matching toolchains found". This resolver downloads the required JDK instead.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ramus-next'
include ':common'
include ':core'
include ':database-storage'
include ':core-simple-attributes'
include ':data-framework-common'
include ':idef0-core'
include ':idef0-report-core'
include ':local-client'
include ':ramus-core-demo'
include ':report-common'
include ':report-core'
include ':startup'
include ':gui-framework-common'
include ':gui-framework-core'
include ':gui-qualifier'
include ':idef0-common'
include ':project-navigator'
include ':print-to-pdf'
include ':excel-import-export'
include ':chart-common'
include ':chart-core'
include ':chart-gui'
