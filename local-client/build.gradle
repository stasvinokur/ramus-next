plugins {
    id 'ramus.java-conventions'
    id 'application'
    // com.gradleup.shadow is the maintained successor to com.github.johnrengelman.shadow,
    // which was abandoned at 8.1.1 and calls CopyProcessingSpec.setFileMode - removed in
    // Gradle 9. Deliberately on the 8.3.x line rather than 9.x: Shadow 9 flipped the default
    // duplicatesStrategy from EXCLUDE to INCLUDE, and this jar merges 18 project jars plus
    // swingx, poi, itext, h2, docking-frames and batik, so every colliding META-INF entry
    // would be duplicated into the archive.
    id 'com.gradleup.shadow' version '8.3.11'
}

// Product naming, single source of truth for the whole build.
// appName is space-free and names everything that lands on disk: the .app bundle, the DMG,
// the mounted volume, the launcher inside Contents/MacOS and the .icns.
// appDisplayName is what the user reads in the menu bar. It may contain spaces and must stay
// under 16 characters, which is the only thing jpackage checks about --mac-package-name.
def appName = 'RamusNext'
def appDisplayName = 'Ramus Next'

dependencies {
    implementation project(':common')
    implementation project(':core')
    implementation project(':gui-qualifier')
    implementation project(':idef0-common')
    implementation project(':idef0-core')
    implementation project(':excel-import-export')
    implementation project(':print-to-pdf')
    implementation 'tablelayout:TableLayout:20050920'
    implementation project(':gui-framework-common')
    implementation project(':gui-framework-core')
    implementation project(':data-framework-common')
    implementation project(':database-storage')

    implementation project(':chart-common')
    implementation project(':chart-core')
    implementation project(':chart-gui')

    implementation 'com.h2database:h2:2.3.232'

    // The MCP server ships inside the same fat jar and is reached by a second launcher with
    // a different main class. One jar rather than two: a second shadow jar would duplicate
    // batik, swingx, docking-frames and the rest, which is 18 MB to save 6.
    implementation project(':mcp-server')
    testImplementation 'junit:junit:4.13.2'
}
tasks.named('test') {
    useJUnit()
}


tasks.register('runLocal', JavaExec) {
    group = 'application'
    description = 'Runs Ramus Next from the compiled classes, without packaging.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.local.Main'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

application {
    mainClass = 'com.ramussoft.local.Main'
    applicationName = appName
}

shadowJar {
    archiveBaseName.set('ramus')
    archiveClassifier.set('')
    archiveVersion.set('')
    
    mergeServiceFiles()
    
    manifest {
        attributes 'Main-Class': 'com.ramussoft.local.Main'
    }
}

// --- macOS packaging (ICNS + DMG via jpackage) ---

// Project.exec and Project.copy are gone in Gradle 9. Their replacement is these two
// services, injected into an object the task actions capture. Groovy build scripts cannot
// declare injected constructors, so this interface exists purely to hold the getters.
interface PackagingServices {
    @javax.inject.Inject ExecOperations getExec()
    @javax.inject.Inject FileSystemOperations getFs()
}

// The staging area is no longer macOS-only: the fat jar and the jlink runtime image are
// built the same way for both installers, and only the icon differs.
def packagingWorkDir = layout.buildDirectory.dir('packaging')
def iconsetDir      = packagingWorkDir.map { it.dir('AppIcon.iconset') }
def icnsFile        = packagingWorkDir.map { it.file("${appName}.icns") }
def jpkgInputDir    = packagingWorkDir.map { it.dir('jpackage-input') }
def runtimeImageDir = packagingWorkDir.map { it.dir('runtime') }
def iconSourceDir   = rootProject.layout.projectDirectory.dir('packaging/macos/AppIcon.appiconset')
def windowsIcon     = rootProject.layout.projectDirectory.file('packaging/windows/RamusNext.ico')
def dmgDestDir      = rootProject.layout.projectDirectory.dir('dest/macos')
def msiDestDir      = rootProject.layout.projectDirectory.dir('dest/windows')

// A Provider survives configuration-cache serialization; reading System.getProperty inside a
// task action would be an untracked build input. Replaces the four uses of Gradle's internal
// org.gradle.internal.os.OperatingSystem, which carries no compatibility guarantee.
def isMacOs = providers.systemProperty('os.name')
        .map { it.toLowerCase(Locale.ROOT).startsWith('mac') }
        .orElse(false)
def isWindows = providers.systemProperty('os.name')
        .map { it.toLowerCase(Locale.ROOT).startsWith('windows') }
        .orElse(false)

// The JDK that supplies jdeps/jlink/jpackage AND becomes the runtime inside the installer.
// This is a different question from the compile toolchain and must not share its value by
// accident. The old fallback chain ended at System.getProperty('java.home') - the daemon's
// JVM - which under a toolchain is emphatically the wrong JDK to bundle.
def packagingJdkVersion = (findProperty('packagingJdkVersion') ?: '21').toString() as Integer
def packagingJavaHomeOverride = findProperty('packagingJavaHome')?.toString()
def packagingHome = packagingJavaHomeOverride
        ? providers.provider { packagingJavaHomeOverride }
        : javaToolchains.launcherFor { it.languageVersion = JavaLanguageVersion.of(packagingJdkVersion) }
                        .map { it.metadata.installationPath.asFile.absolutePath }

// Gradle property lookups are hoisted to configuration time on purpose. What the
// configuration cache forbids is touching Project from a task ACTION; reading properties
// here is fine, and findProperty (rather than providers.gradleProperty) is required because
// the root build loads gradle-local.properties into project.ext, which providers never see.
def jdepsOverride = findProperty('packagingJdepsBin')?.toString()
def jlinkOverride = findProperty('packagingJlinkBin')?.toString()
def jmodsOverride = findProperty('packagingJmodsPath')?.toString()
def wantJlink     = findProperty('packagingUseJlink')?.toString()?.toBoolean() != false

def rawVersion = (project.version ?: '1.0.0').toString().replaceAll(/[^0-9.]/, '')
// Windows MSI needs exactly MAJOR.MINOR.PATCH and macOS needs a first component >= 1, so
// normalise to the intersection rather than to what each platform will individually accept.
def appVersion = (rawVersion ==~ /\d+(\.\d+){0,2}/) ? rawVersion : '1.0.0'
while (appVersion.count('.') < 2) appVersion += '.0'

def iconMapping = [
    'icon_16x16.png'      : [file: '16-mac.png',   size: 16],
    'icon_16x16@2x.png'   : [file: '32-mac.png',   size: 32],
    'icon_32x32.png'      : [file: '32-mac.png',   size: 32],
    'icon_32x32@2x.png'   : [file: '64-mac.png',   size: 64],
    'icon_128x128.png'    : [file: '128-mac.png',  size: 128],
    'icon_128x128@2x.png' : [file: '256-mac.png',  size: 256],
    'icon_256x256.png'    : [file: '256-mac.png',  size: 256],
    'icon_256x256@2x.png' : [file: '512-mac.png',  size: 512],
    'icon_512x512.png'    : [file: '512-mac.png',  size: 512],
    'icon_512x512@2x.png' : [file: '1024-mac.png', size: 1024],
]

tasks.register('prepareMacIcons') {
    group = 'distribution'
    description = 'Rescales packaging/macos/AppIcon.appiconset into an .iconset using sips.'
    def services = objects.newInstance(PackagingServices)
    def onMac = isMacOs
    def srcDir = iconSourceDir
    def outDir = iconsetDir
    def mapping = iconMapping

    inputs.dir(srcDir).withPropertyName('iconSources')
    inputs.property('mapping', mapping.toString())
    outputs.dir(outDir).withPropertyName('iconset')

    doLast {
        if (!onMac.get()) {
            throw new GradleException('prepareMacIcons must be executed on macOS (uses sips)')
        }
        def srcBase = srcDir.asFile
        def target = outDir.get().asFile
        target.mkdirs()
        mapping.each { targetName, meta ->
            def src = new File(srcBase, meta.file)
            if (!src.exists()) throw new GradleException("Missing icon asset: ${src}")
            def out = new File(target, targetName)
            services.exec.exec {
                commandLine 'sips', '-s', 'format', 'png',
                        '-z', meta.size as String, meta.size as String,
                        src.absolutePath, '--out', out.absolutePath
            }
        }
        logger.lifecycle "Prepared iconset at: ${target}"
    }
}

tasks.register('makeIcns') {
    group = 'distribution'
    description = 'Converts the generated .iconset into an .icns using iconutil.'
    dependsOn 'prepareMacIcons'
    def services = objects.newInstance(PackagingServices)
    def onMac = isMacOs
    def inDir = iconsetDir
    def outFile = icnsFile

    inputs.dir(inDir).withPropertyName('iconset')
    outputs.file(outFile).withPropertyName('icns')

    doLast {
        if (!onMac.get()) throw new GradleException('makeIcns requires macOS (iconutil)')
        def out = outFile.get().asFile
        out.parentFile.mkdirs()
        services.exec.exec {
            commandLine 'iconutil', '-c', 'icns', inDir.get().asFile.absolutePath, '-o', out.absolutePath
        }
        logger.lifecycle "Built ICNS: ${out}"
    }
}

// Sync rather than Copy: jpackage --input copies EVERYTHING in this directory into the
// bundle, so a stale artifact left by a rename would silently ship. Sync also removes the
// Project.copy call and gets the task dependency from the shadowJar provider rather than
// from a configuration-time reference to the task object.
tasks.register('prepareJpackageInput', Sync) {
    group = 'distribution'
    description = 'Stages the fat jar for jpackage.'
    from(tasks.named('shadowJar')) { rename { 'ramus.jar' } }
    into jpkgInputDir
}

// Build a minimized runtime image with jlink using detected modules
tasks.register('jlinkImage') {
    group = 'distribution'
    description = 'Builds a minimised runtime image with jlink from the modules jdeps detects.'
    dependsOn 'prepareJpackageInput'

    def services = objects.newInstance(PackagingServices)
    def onSupportedOs = isMacOs.zip(isWindows) { mac, win -> mac || win }
    def appJar = jpkgInputDir.map { it.file('ramus.jar') }
    def imageDir = runtimeImageDir
    def javaHomeP = packagingHome
    def multiRelease = packagingJdkVersion.toString()
    def jdepsBinOverride = jdepsOverride
    def jlinkBinOverride = jlinkOverride
    def jmodsPathOverride = jmodsOverride
    def useJlink = wantJlink
    def onWindows = isWindows

    inputs.file(appJar).withPropertyName('appJar')
    inputs.property('packagingJavaHome', javaHomeP)
    inputs.property('useJlink', useJlink)
    inputs.property('multiRelease', multiRelease)
    inputs.property('jmodsOverride', jmodsPathOverride ?: '')
    outputs.dir(imageDir).withPropertyName('runtimeImage')

    doLast {
        def target = imageDir.get().asFile
        if (!onSupportedOs.get()) {
            target.deleteDir()
            logger.lifecycle 'jlinkImage skipped: neither macOS nor Windows'
            return
        }
        if (!useJlink) {
            // Drop any image left by an earlier build, otherwise jpackageDmg would still
            // pick it up and the documented opt-out would silently do nothing.
            target.deleteDir()
            logger.lifecycle 'jlinkImage skipped: packagingUseJlink=false'
            return
        }
        def javaHome = javaHomeP.get()
        def exe = onWindows.get() ? '.exe' : ''
        def jdepsBin = jdepsBinOverride ?: new File(javaHome, "bin/jdeps${exe}").absolutePath
        def jlinkBin = jlinkBinOverride ?: new File(javaHome, "bin/jlink${exe}").absolutePath

        // Works across JDK layouts (Temurin/Oracle/GraalVM)
        def modulePath = [jmodsPathOverride ? new File(jmodsPathOverride) : null,
                          new File(javaHome, 'jmods'),
                          new File(javaHome, 'lib/jmods'),
                          new File(javaHome, 'lib/modules')]
                .findAll { it != null && it.exists() }
        if (modulePath.isEmpty()) {
            logger.warn "jlinkImage warning: no platform modules under ${javaHome}. Falling back to the full JDK."
            target.deleteDir()
            return
        }
        target.deleteDir() // jlink requires the output directory to NOT exist

        def sout = new ByteArrayOutputStream()
        def serr = new ByteArrayOutputStream()
        // --multi-release used to come from the DAEMON's java.specification.version, so jdeps
        // could resolve multi-release classes for a JVM that will never run them. Bind it to
        // the JDK actually being bundled.
        def result = services.exec.exec {
            commandLine jdepsBin, '-q', '--multi-release', multiRelease,
                    '--ignore-missing-deps', '--print-module-deps', appJar.get().asFile.absolutePath
            standardOutput = sout
            errorOutput = serr
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            // Previously indistinguishable from a silent success, which is how a DMG could
            // quietly ship the default module set.
            logger.warn "jlinkImage warning: jdeps exited ${result.exitValue}: ${serr.toString('UTF-8').trim()}"
        }

        def lines = sout.toString('UTF-8').readLines().collect { it.trim() }.findAll { it }
        def detected = lines.reverse().find { it ==~ /[a-z0-9_.]+(\s*,\s*[a-z0-9_.]+)*/ }
        if (!detected) {
            // Reasonable default set for Swing + H2 + common APIs
            detected = 'java.base,java.desktop,java.datatransfer,java.logging,java.prefs,java.scripting,java.xml,java.xml.crypto,java.sql,java.naming,jdk.unsupported,jdk.charsets,jdk.xml.dom'
            logger.lifecycle "jdeps did not detect modules; using default set: ${detected}"
        } else {
            def mods = detected.split(',').collect { it.trim() }.findAll { it ==~ /[a-z][a-z0-9_.]*/ }
            if (!mods.contains('java.base')) mods.add(0, 'java.base')
            detected = mods.unique().join(',')
            logger.lifecycle "Detected modules: ${detected}"
        }
        // Modules loaded through the service-provider mechanism rather than referenced in
        // bytecode. jdeps cannot see them, so they must be added by hand or jlink drops them.
        //
        //   jdk.localedata - without it the image carries 5 locales instead of 1069: a user
        //     who switches the UI to Russian still gets "Jan" for January and 1,234.5 instead
        //     of 1 234,5, even though the interface strings translate. ~10 MB.
        //   jdk.crypto.ec  - without it every HTTPS handshake fails outright, because modern
        //     servers require ECDHE. Nothing in the app uses HTTPS today (the update check is
        //     plain http and the About links open in the system browser), so this is insurance
        //     against a silent failure the day any URL moves to https. ~1 MB.
        def serviceModules = ['jdk.localedata', 'jdk.crypto.ec']
        def missing = serviceModules.findAll { !(it in detected.split(',').collect { m -> m.trim() }) }
        if (missing) {
            detected = detected + ',' + missing.join(',')
            logger.lifecycle "Added service-loaded modules jdeps cannot detect: ${missing.join(',')}"
        }
        try {
            services.exec.exec {
                commandLine jlinkBin,
                        '--module-path', modulePath*.absolutePath.join(File.pathSeparator),
                        '--add-modules', detected,
                        '--no-header-files', '--no-man-pages', '--strip-debug',
                        // The numeric --compress values are deprecated on every supported JDK
                        // and slated for removal; zip-6 is the current spelling of the same
                        // thing. Requires JDK 21+, which packagingJdkVersion guarantees.
                        '--compress', 'zip-6',
                        '--output', target.absolutePath
            }
            logger.lifecycle "Built custom runtime image at: ${target}"
        } catch (Exception ex) {
            logger.warn "jlinkImage warning: jlink failed (${ex.message}). Falling back to full JDK at runtime."
            target.deleteDir()
        }
    }
}

// The static parts of the jpackage command line, known at configuration time so they can
// serve as real task inputs - with Exec + doFirst, changing --vendor would not invalidate
// anything.
def commonJpackageArgs = [
        '--app-version', appVersion,
        '--main-jar', 'ramus.jar',
        '--main-class', 'com.ramussoft.local.Main',
        '--vendor', 'Ramus Next Project',
        '--copyright', 'Copyright (C) 2005-2025 Vitaliy Yakovchuk, Oleksiy Chizhevskiy; (C) 2026 Stanislav Vinokur. GPL-3.0.',
        '--description', 'Ramus Next - IDEF0 and DFD business process modeller.',
        // POI 5 brings log4j-api with no implementation, so the first Excel operation
        // prints "Log4j API could not find a logging provider" to stderr. Point it at the
        // built-in simple logger instead. No spaces in the value, which matters here: see
        // the note below about how jpackage splits --java-options.
        '--java-options', '-Dlog4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory',
]

def macJpackageArgs = commonJpackageArgs + [
        '--type', 'dmg',
        '--dest', dmgDestDir.asFile.absolutePath,
        '--name', appName,
        '--mac-package-identifier', 'com.stasvinokur.ramusnext',
        '--mac-package-name', appDisplayName,
        '--java-options', '-Dapple.laf.useScreenMenuBar=true',
]

def windowsJpackageArgs = commonJpackageArgs + [
        '--type', 'msi',
        '--dest', msiDestDir.asFile.absolutePath,
        // The display name, not appName, and the asymmetry with macOS is deliberate. On
        // Windows the launcher name IS the user-visible name in every place there is - the
        // Start menu entry, Add/Remove Programs, the folder under Program Files - and there
        // is no second field to carry it, whereas macOS has CFBundleName. This is the first
        // thing to look at if the Windows job fails: --name with a space has to survive the
        // WiX 3 template.
        '--name', appDisplayName,
        // Without this, jpackage mints a fresh product GUID on every build, so installing
        // 2.0.3 would not replace 2.0.2 - two entries in Add/Remove Programs, two shortcuts,
        // two copies under Program Files. It is the identity of the product, not of the
        // version, so it is generated once and never changes again.
        '--win-upgrade-uuid', '11406996-D9AE-442B-80DC-5ED748B8D637',
        '--win-menu',
        '--win-menu-group', appDisplayName,
        '--win-shortcut',
        // Per-machine, which is what the old NSIS installer did and what the application
        // expects: it never writes into its own directory, settings go to %APPDATA%. Note
        // that this is a one-way door - a per-user MSI cannot upgrade a per-machine install,
        // so changing it after a release means everyone reinstalls by hand.
        '--win-dir-chooser',
]
// Deliberately NOT passing -Dapple.awt.application.name: jpackage splits every --java-options
// value on whitespace when it writes the .cfg, so a name containing a space becomes two
// entries and the second one ("Next") reaches the JVM as a main class, making the packaged app
// fail to start with ClassNotFoundException. The bundled app takes its menu bar name from
// CFBundleName (set via --mac-package-name) anyway, and Main.java sets the property at runtime
// for the unpackaged case.

// The same .rsf association the Windows installer registers, for the macOS bundle. jpackage
// turns this into CFBundleDocumentTypes in Info.plist, without which Finder has no idea the
// application can open a model and a double-click does nothing at all. The icon has to be an
// .icns here rather than the .ico the Windows descriptor points at, which is why this is a
// second task and not a shared one.
tasks.register('prepareMacFileAssociations', WriteProperties) {
    group = 'distribution'
    description = 'Writes the .rsf file-association descriptor for jpackage on macOS.'
    destinationFile = packagingWorkDir.map { it.file('rsf-association-mac.properties') }
    property 'extension', 'rsf'
    property 'mime-type', 'application/x-ramus-model'
    property 'description', "${appDisplayName} model"
    property 'icon', icnsFile.get().asFile.absolutePath
}


// A second launcher in the same package, pointing at a different main class in the same fat
// jar. This is what makes the MCP server usable at all: an agent host needs a command to
// run, and this one carries the bundled Java runtime with it, so a user who has never
// installed a JDK can point Claude at RamusNext.app/Contents/MacOS/ramus-mcp and be done.
//
// win-console matters and is easy to miss: without it Windows builds a GUI executable with
// no console, whose standard input and output are not connected to anything - and this
// server speaks its protocol on exactly those two streams.
tasks.register('prepareMcpLauncher', WriteProperties) {
    group = 'distribution'
    description = 'Writes the descriptor for the ramus-mcp launcher.'
    destinationFile = packagingWorkDir.map { it.file('ramus-mcp-launcher.properties') }
    property 'main-class', 'com.ramussoft.mcp.RamusMcpServer'
    property 'main-jar', 'ramus.jar'
    property 'win-console', 'true'
    property 'description', "${appDisplayName} MCP server"
    // Two options, and the second is here only because the first one exists. jpackage merges
    // an added launcher's properties over the main application's per KEY, replacing rather
    // than appending, so naming java-options at all discards the list the application passes -
    // including the log4j2 factory, which is why it is repeated verbatim.
    //
    // What is deliberately NOT repeated is -Dapple.laf.useScreenMenuBar: a server that talks
    // over standard input has no menu bar to put anywhere. Left inherited, it was one of the
    // things telling macOS this process is an application, and the visible result was a Dock
    // icon that appeared the moment an agent asked for a diagram, and took the focus with it -
    // out of whatever the person was doing, back to the first desktop.
    //
    // apple.awt.UIElement is what makes it an accessory instead: no Dock icon, no menu bar, no
    // activation, and AWT still works. It has to be here rather than in Info.plist, because
    // that file is shared with the application launcher and LSUIElement there would hide the
    // application too. Inert on Windows, where this descriptor is used as well.
    //
    // One string, split on whitespace by jpackage - see the note by macJpackageArgs. No -D
    // value here may contain a space.
    property 'java-options', '-Dapple.awt.UIElement=true ' +
            '-Dlog4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory'
}

tasks.register('jpackageDmg') {
    group = 'distribution'
    description = 'Runs jpackage to produce the DMG.'
    dependsOn 'prepareJpackageInput', 'makeIcns', 'jlinkImage', 'prepareMacFileAssociations', 'prepareMcpLauncher'

    def services = objects.newInstance(PackagingServices)
    def onMac = isMacOs
    def javaHomeP = packagingHome
    def imageDir = runtimeImageDir
    def inputDir = jpkgInputDir
    def icns = icnsFile
    def destDir = dmgDestDir
    def args = macJpackageArgs
    def associations = tasks.named('prepareMacFileAssociations')
            .flatMap { it.destinationFile }
    def mcpLauncher = tasks.named('prepareMcpLauncher').flatMap { it.destinationFile }
    def outDmg = dmgDestDir.file("${appName}-${appVersion}.dmg")

    inputs.dir(inputDir).withPropertyName('jpackageInput')
    inputs.file(icns).withPropertyName('icns')
    inputs.file(associations).withPropertyName('fileAssociations')
    inputs.file(mcpLauncher).withPropertyName('mcpLauncher')
    // files() rather than dir(): the image legitimately may not exist when jlink is disabled,
    // and an @InputDirectory fails validation on a missing path.
    inputs.files(imageDir).withPropertyName('runtimeImage')
    inputs.property('jpackageArgs', args)
    inputs.property('packagingJavaHome', javaHomeP)
    outputs.file(outDmg).withPropertyName('dmg')

    doLast {
        if (!onMac.get()) throw new GradleException('jpackageDmg must be executed on macOS')
        def javaHome = javaHomeP.get()
        destDir.asFile.mkdirs()

        // jpackage refuses to overwrite an existing bundle, so a repeated run would fail on
        // the artifact left by the previous one.
        def dmg = outDmg.asFile
        if (dmg.exists()) {
            dmg.delete()
            logger.lifecycle "Removed previous ${dmg.name}"
        }

        // Still resolved at execution time, and for the original reason: runtimeImageDir is
        // produced by the jlinkImage task this one depends on, so on a clean tree it does not
        // exist at configuration time and the runtime choice would silently fall back to the
        // full JDK. The configuration cache permits this - what it forbids is touching Project.
        def image = imageDir.get().asFile
        def hasImage = new File(image, 'bin/java').exists()
        def runtimePath = hasImage ? image.absolutePath : javaHome
        if (hasImage) {
            logger.lifecycle "Bundling the jlink runtime image from ${image}"
        } else {
            logger.lifecycle "Bundling the full JDK from ${javaHome} (no jlink image available)"
        }

        services.exec.exec {
            commandLine([new File(javaHome, 'bin/jpackage').absolutePath] + args +
                    ['--input', inputDir.get().asFile.absolutePath,
                     '--icon', icns.get().asFile.absolutePath,
                     '--file-associations', associations.get().asFile.absolutePath,
                     '--add-launcher', 'ramus-mcp=' + mcpLauncher.get().asFile.absolutePath,
                     '--runtime-image', runtimePath])
        }
    }
}

tasks.register('macDmg') {
    group = 'distribution'
    description = 'Builds a DMG at dest/macos using jpackage.'
    dependsOn 'jpackageDmg'
}

// --- Windows packaging (MSI via jpackage) ---

// The .rsf association the NSIS installer used to register. Runner.java opens args[0], so
// double-clicking a model is a feature the application already has and only the installer was
// missing. Written rather than committed because the icon has to be an absolute path.
tasks.register('prepareWindowsFileAssociations', WriteProperties) {
    group = 'distribution'
    description = 'Writes the .rsf file-association descriptor for jpackage.'
    destinationFile = packagingWorkDir.map { it.file('rsf-association.properties') }
    property 'extension', 'rsf'
    property 'mime-type', 'application/x-ramus-model'
    property 'description', "${appDisplayName} model"
    property 'icon', windowsIcon.asFile.absolutePath
}

tasks.register('jpackageMsi') {
    group = 'distribution'
    description = 'Runs jpackage to produce the Windows MSI.'
    dependsOn 'prepareJpackageInput', 'jlinkImage', 'prepareWindowsFileAssociations', 'prepareMcpLauncher'

    def services = objects.newInstance(PackagingServices)
    def onWindows = isWindows
    def javaHomeP = packagingHome
    def imageDir = runtimeImageDir
    def inputDir = jpkgInputDir
    def icon = windowsIcon
    def destDir = msiDestDir
    def args = windowsJpackageArgs
    def associations = tasks.named('prepareWindowsFileAssociations')
            .flatMap { it.destinationFile }
    def mcpLauncher = tasks.named('prepareMcpLauncher').flatMap { it.destinationFile }
    def outMsi = msiDestDir.file("${appDisplayName}-${appVersion}.msi")

    inputs.dir(inputDir).withPropertyName('jpackageInput')
    inputs.file(icon).withPropertyName('icon')
    inputs.file(associations).withPropertyName('fileAssociations')
    inputs.file(mcpLauncher).withPropertyName('mcpLauncher')
    inputs.files(imageDir).withPropertyName('runtimeImage')
    inputs.property('jpackageArgs', args)
    inputs.property('packagingJavaHome', javaHomeP)
    outputs.file(outMsi).withPropertyName('msi')

    doLast {
        if (!onWindows.get()) {
            // Not a skip. jpackage builds only for the OS it runs on, so an MSI cannot be
            // produced from macOS or Linux by any means, and pretending otherwise would let
            // a release go out without one.
            throw new GradleException('jpackageMsi must be executed on Windows')
        }
        def javaHome = javaHomeP.get()
        destDir.asFile.mkdirs()

        def msi = outMsi.asFile
        if (msi.exists()) {
            msi.delete()
            logger.lifecycle "Removed previous ${msi.name}"
        }

        // Same reason as the DMG: the image is produced by the task this one depends on, so
        // it does not exist at configuration time and the choice has to be made here.
        def image = imageDir.get().asFile
        def hasImage = new File(image, 'bin/java.exe').exists()
        def runtimePath = hasImage ? image.absolutePath : javaHome
        if (hasImage) {
            logger.lifecycle "Bundling the jlink runtime image from ${image}"
        } else {
            logger.lifecycle "Bundling the full JDK from ${javaHome} (no jlink image available)"
        }

        services.exec.exec {
            commandLine([new File(javaHome, 'bin/jpackage.exe').absolutePath] + args +
                    ['--input', inputDir.get().asFile.absolutePath,
                     '--icon', icon.asFile.absolutePath,
                     '--file-associations', associations.get().asFile.absolutePath,
                     '--add-launcher', 'ramus-mcp=' + mcpLauncher.get().asFile.absolutePath,
                     '--runtime-image', runtimePath])
        }
    }
}

tasks.register('windowsMsi') {
    group = 'distribution'
    description = 'Builds an MSI at dest/windows using jpackage.'
    dependsOn 'jpackageMsi'
}

// Sync rather than Copy: the old task used Contents/MacOS as its destination root, so a
// rename would leave orphans in the bundle forever. The Info.plist and launcher are built at
// configuration time so they are real task inputs, and CFBundleVersion now tracks
// project.version instead of the hard-coded 2.0 it had drifted to.
tasks.register('createMacApp', Sync) {
    group = 'distribution'
    description = "Assembles an unsigned ${appName}.app under build/mac-app for local testing."
    dependsOn 'makeIcns'

    def appDir = layout.buildDirectory.dir("mac-app/${appName}.app")
    def bundleName = appName

    into appDir
    from(tasks.named('shadowJar')) { into 'Contents/MacOS'; rename { 'ramus.jar' } }
    from(icnsFile) { into 'Contents/Resources' }

    def plistText = """<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>${appDisplayName}</string>
    <key>CFBundleDisplayName</key>
    <string>${appDisplayName}</string>
    <key>CFBundleIdentifier</key>
    <string>com.stasvinokur.ramusnext</string>
    <key>CFBundleVersion</key>
    <string>${appVersion}</string>
    <key>CFBundleShortVersionString</key>
    <string>${appVersion}</string>
    <key>CFBundleExecutable</key>
    <string>${appName}</string>
    <key>CFBundleIconFile</key>
    <string>${appName}</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleSignature</key>
    <string>????</string>
    <key>LSMinimumSystemVersion</key>
    <string>10.9</string>
    <key>NSHighResolutionCapable</key>
    <true/>
    <key>NSHumanReadableCopyright</key>
    <string>Copyright (C) 2005-2025 Vitaliy Yakovchuk, Oleksiy Chizhevskiy; (C) 2026 Stanislav Vinokur. GPL-3.0.</string>
</dict>
</plist>"""

    // -Xdock:name is parsed by a real shell here, so the spaced display name must stay quoted:
    // unquoted, "Next" would arrive as a bogus argument and the JVM would refuse to start.
    def launcherText = """#!/bin/bash
cd "\$(dirname "\$0")"
# Use the app's icon in the Dock instead of the Java default
exec java -Xdock:name="${appDisplayName}" -Xdock:icon="../Resources/${appName}.icns" -jar ramus.jar "\$@"
"""

    inputs.property('infoPlist', plistText)
    inputs.property('launcher', launcherText)

    doLast {
        def contents = new File(appDir.get().asFile, 'Contents')
        new File(contents, 'Info.plist').text = plistText
        def executable = new File(contents, "MacOS/${bundleName}")
        executable.text = launcherText
        executable.setExecutable(true)
        logger.lifecycle "macOS app created at: ${appDir.get().asFile}"
    }
}
