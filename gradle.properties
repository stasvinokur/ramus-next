# Gradle applies project properties named `group` and `version` to every project,
# so declaring them here replaces the per-module copies that used to drift apart.
group=com.stasvinokur.ramusnext
version=2.0.2

# Three separate questions that used to be one accident.
#
#   javaToolchainVersion - which JDK runs javac. Independent of the JVM running the
#       Gradle daemon, which is free to be anything modern.
#   javaRelease          - what that javac emits and, through ct.sym, what JDK API it
#       is allowed to see. This is what actually pins compatibility.
#   packagingJdkVersion  - supplies jdeps/jlink/jpackage and IS the runtime bundled
#       into the installers, so this one is what users end up running.
#
# The only hard constraint is javaToolchainVersion >= javaRelease.
javaToolchainVersion=21
javaRelease=17
packagingJdkVersion=21
