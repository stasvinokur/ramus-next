# Application-wide theme tokens. Registered by AppTheme via
# FlatLaf.registerCustomDefaultsSource, and applied on top of whichever FlatLaf theme is
# active - so anything here is shared by the light theme and by a dark one when it arrives.
#
# The interface font is deliberately NOT set. FlatLaf falls back to the platform UI font -
# the system font on macOS, Segoe UI on Windows - which is both what a native application
# looks like and what keeps the existing hardcoded component sizes valid. There are 54
# setPreferredSize calls and two dialogs with a hardcoded 440x278 in this code base; a
# global font change moves all of them. If the interface ever needs to be a step larger,
# this is the one line to add, and it can be made per-platform:
#
#   defaultFont = +1
#   [win]defaultFont = +1
