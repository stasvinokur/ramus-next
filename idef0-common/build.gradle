plugins {
    id 'ramus.java-conventions'
}

dependencies {
    implementation project(':gui-framework-common')
    implementation project(':gui-framework-core')
    implementation project(':idef0-core')
    implementation project(':report-common')
    // freehep-io, -graphicsbase, -graphics2d and -graphicsio all declare junit at COMPILE
    // scope, which is how a test framework ended up inside the shipped application jar -
    // 340 classes of JUnit 4.10 and Hamcrest 1.1, plus a freehep test suite. Nothing here
    // runs them.
    implementation('org.freehep:freehep-graphicsio-emf:2.4') {
        exclude group: 'junit'
        exclude group: 'org.hamcrest'
        exclude group: 'org.freehep', module: 'freehep-graphicsio-tests'
    }
    // batik:batik-svggen:1.6-1 is from 2005, under the pre-Apache coordinates, and it drags
    // in Xerces 2.5.0 (2003) plus xml-apis 2.0.2 (2002). That is not dead weight: those jars
    // register themselves as the JAXP SAXParserFactory, DocumentBuilderFactory and SAX
    // driver through service files that the fat jar preserves, so a 2003 parser was handling
    // EVERY XML read in the application - every model file load included, not just SVG
    // export. batik-dom is declared explicitly rather than relied on transitively.
    implementation('org.apache.xmlgraphics:batik-svggen:1.19') {
        // xml-apis is a standalone copy of javax.xml.parsers, org.xml.sax and org.w3c.dom -
        // i.e. of packages the JDK exports from module java.xml. Shipping it duplicates the
        // platform API inside the application jar for no benefit. xml-apis-ext is different
        // and is kept: it carries org.w3c.dom.svg, smil and css.sac, which batik needs and
        // the JDK does not provide.
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation('org.apache.xmlgraphics:batik-dom:1.19') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation 'javax.help:javahelp:2.0.05'
    implementation project(':common')
    implementation project(':core')
    implementation project(':report-core')
    implementation project(':gui-qualifier')
    implementation project(':core-simple-attributes')
    implementation project(':database-storage')
    implementation project(':data-framework-common')
    implementation files('../gui-qualifier/libs/my-spell-core.jar')
    implementation files('../gui-qualifier/libs/my-spell-swing.jar')
    implementation 'net.htmlparser.jericho:jericho-html:3.3'
    implementation 'org.swinglabs.swingx:swingx-all:1.6.5-1'
    implementation 'tablelayout:TableLayout:20050920'
    testImplementation 'junit:junit:4.13.2'
}
