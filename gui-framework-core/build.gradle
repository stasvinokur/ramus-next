plugins {
    id 'ramus.java-conventions'
}

dependencies {
    implementation project(':gui-framework-common')
    implementation project(':common')
    implementation 'org.dockingframes:docking-frames-common:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}

// junit was declared here before the module had any tests. Gradle no longer picks a test
// framework by default, so without this the test task compiles the sources and runs none.
tasks.named('test') {
    useJUnit()
}
