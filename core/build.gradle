plugins {
    id 'ramus.java-conventions'
}

dependencies {
    // The JavaScript engine for report scripts and formula functions. Nashorn left the JDK
    // in 15 and nothing replaced it, so until now getEngineByName("JavaScript") returned
    // null and every scripted formula and JSSP report threw a NullPointerException.
    // rhino rather than rhino-runtime: the latter is frozen at 1.7.15 while this line is
    // maintained, it carries no tools or debugger, and the difference is 0.4 MB.
    implementation 'org.mozilla:rhino:1.9.1'

    implementation project(':common')
    implementation project(':database-storage')
    testImplementation 'junit:junit:4.13.2'

    // The same driver the application runs on. TableXmlRoundTripTest exists to catch the
    // model file breaking when this version moves, so it has to be this version.
    testRuntimeOnly 'com.h2database:h2:2.3.232'
}

tasks.named('test') {
    useJUnit()
}
